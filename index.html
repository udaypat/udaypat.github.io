<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nagpur Metro Route Planner</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Flatpickr CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/material_orange.css">

    <style>
        :root {
            --metro-orange: #FF7A00;
            --metro-aqua: #0078D7;
            --metro-orange-dark: #e06c00;
            --bg-color: #f4f6f9;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            -webkit-font-smoothing: antialiased;
        }

        .text-metro-orange {
            color: var(--metro-orange) !important;
        }

        .btn-metro-orange {
            background-color: var(--metro-orange);
            color: white;
            border: none;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-metro-orange:hover,
        .btn-metro-orange:focus {
            background-color: var(--metro-orange-dark);
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 122, 0, 0.2);
        }

        .card-custom {
            border: none;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
            background: #ffffff;
        }

        .form-select,
        .form-control {
            border-radius: 8px;
            padding: 0.75rem 1rem;
            border: 1px solid #dee2e6;
            font-size: 0.95rem;
        }

        .form-select:focus,
        .form-control:focus {
            border-color: var(--metro-orange);
            box-shadow: 0 0 0 0.25rem rgba(255, 122, 0, 0.25);
        }

        .form-label {
            font-weight: 600;
            color: #555;
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
        }

        /* Timeline Styles */
        .timeline-container {
            position: relative;
            padding-left: 1.5rem;
        }

        .timeline-line {
            position: absolute;
            left: calc(1.5rem + 7px);
            top: 20px;
            bottom: 20px;
            width: 2px;
            background: #e9ecef;
            z-index: 0;
        }

        .timeline-step {
            display: flex;
            align-items: flex-start;
            position: relative;
            z-index: 1;
            margin-bottom: 1.5rem;
        }

        .timeline-step:last-child {
            margin-bottom: 0;
        }

        .timeline-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--metro-orange);
            margin-right: 1rem;
            margin-top: 4px;
            flex-shrink: 0;
            border: 3px solid #fff;
            box-shadow: 0 0 0 1px var(--metro-orange);
        }

        .timeline-dot.aqua {
            background: var(--metro-aqua);
            box-shadow: 0 0 0 1px var(--metro-aqua);
        }

        .timeline-dot.transfer {
            background: #fff;
            border: 4px solid #6c757d;
            box-shadow: none;
        }

        .timeline-content {
            flex-grow: 1;
        }

        .timeline-time {
            font-weight: 700;
            color: #333;
        }

        .timeline-station {
            color: #555;
            font-size: 0.95rem;
        }

        .transfer-details {
            font-size: 0.85rem;
            color: #6c757d;
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 6px;
            display: inline-block;
        }

        .swap-btn {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
            cursor: pointer;
            transition: all 0.2s;
            margin: -10px auto;
            position: relative;
            z-index: 2;
        }

        .swap-btn:hover {
            background: #e9ecef;
            color: var(--metro-orange);
            border-color: #ced4da;
        }

        /* Custom Radio Toggle */
        .btn-group-toggle .btn {
            border: 1px solid #dee2e6;
            color: #6c757d;
            font-weight: 500;
        }

        .btn-group-toggle .btn-check:checked+.btn {
            background-color: var(--metro-orange);
            border-color: var(--metro-orange);
            color: white;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm mb-4 py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="#">
                <i class="bi bi-train-front text-metro-orange fs-3"></i>
                <span class="text-dark">Nagpur Metro</span>
            </a>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row g-4">

            <!-- Form Column -->
            <div class="col-lg-4 col-md-5">
                <div class="card card-custom p-4">
                    <h5 class="fw-bold mb-4 text-metro-orange">Plan Your Journey</h5>

                    <div class="mb-3 position-relative">
                        <label for="origin" class="form-label">From Station</label>
                        <select id="origin" class="form-select"></select>
                    </div>

                    <div class="text-center" style="height: 0;">
                        <button class="swap-btn" onclick="swapStations()" title="Swap Stations">
                            <i class="bi bi-arrow-down-up"></i>
                        </button>
                    </div>

                    <div class="mb-4">
                        <label for="destination" class="form-label">To Station</label>
                        <select id="destination" class="form-select"></select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label d-block mb-2">Time Mode</label>
                        <div class="btn-group w-100 btn-group-toggle mb-3" role="group">
                            <input type="radio" class="btn-check" name="timeMode" id="depart" value="depart" checked>
                            <label class="btn btn-light" for="depart">Depart at</label>

                            <input type="radio" class="btn-check" name="timeMode" id="arrive" value="arrive">
                            <label class="btn btn-light" for="arrive">Arrive by</label>
                        </div>

                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i
                                    class="bi bi-clock text-muted"></i></span>
                            <input type="text" id="time" class="form-control border-start-0 ps-0"
                                placeholder="Select Time">
                        </div>
                    </div>

                    <button class="btn btn-metro-orange w-100 py-3 rounded-pill" onclick="calculateRoutes()">
                        <i class="bi bi-search me-2"></i> Find Next Trains
                    </button>
                </div>
            </div>

            <!-- Results Column -->
            <div class="col-lg-8 col-md-7">
                <div id="results">
                    <!-- Initial Empty State -->
                    <div class="card card-custom h-100 d-flex flex-column align-items-center justify-content-center p-5 text-center text-muted"
                        style="min-height: 400px;">
                        <i class="bi bi-map text-light mb-3" style="font-size: 4rem;"></i>
                        <h5 class="fw-bold">Ready to travel?</h5>
                        <p class="mb-0">Select your origin, destination, and time to view the best routes and timings.
                        </p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="router_planner.js"></script>

    <script>
        let metroData = null;

        // Populate Dropdowns
        function initDropdowns() {
            const stationsSet = new Set();
            metroData.lines.forEach(line => {
                line.directions[0].stations.forEach(s => stationsSet.add(s));
            });

            const stations = Array.from(stationsSet).sort();
            const originSelect = document.getElementById('origin');
            const destSelect = document.getElementById('destination');

            stations.forEach(station => {
                originSelect.add(new Option(station, station));
                destSelect.add(new Option(station, station));
            });

            // Set default destinations
            originSelect.value = "Automotive Square";
            destSelect.value = "Lokmanya Nagar";
        }

        // Swap Stations Helper
        function swapStations() {
            const origin = document.getElementById('origin');
            const dest = document.getElementById('destination');
            const temp = origin.value;
            origin.value = dest.value;
            dest.value = temp;
        }

        // Initialize Flatpickr
        flatpickr("#time", {
            enableTime: true,
            noCalendar: true,
            dateFormat: "H:i",
            altInput: true,
            altFormat: "h:i K",
            time_24hr: false,
            defaultDate: new Date()
        });

        // Load Data
        fetch('routes.json')
            .then(response => response.json())
            .then(data => {
                metroData = data;
                initDropdowns();
            })
            .catch(error => {
                console.error('Error loading routes.json:', error);
                document.getElementById('results').innerHTML = `
                    <div class="alert alert-danger d-flex align-items-center" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2 flex-shrink-0"></i>
                        <div>Error loading route data. Please ensure routes.json is available.</div>
                    </div>`;
            });
    </script>
</body>

</html>
