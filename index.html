<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nagpur Metro Route Planner</title>
    <style>
        :root {
            --primary: #FF7A00;
            --primary-dark: #cc6200;
            --bg: #f4f4f9;
            --card-bg: #ffffff;
            --text: #333333;
            --text-light: #666666;
            --border: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        select,
        input[type="time"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        #results {
            margin-top: 30px;
        }

        .itinerary {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .itinerary-header {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .step {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .step.transfer {
            color: var(--text-light);
            font-size: 0.9em;
            margin: 10px 0;
            padding-left: 10px;
            border-left: 3px solid var(--primary);
        }

        .error {
            color: #d32f2f;
            text-align: center;
            font-weight: bold;
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/material_orange.css">
</head>

<body>

    <div class="container">
        <h1>Nagpur Metro Planner</h1>

        <div class="form-group">
            <label for="origin">From Station</label>
            <select id="origin"></select>
        </div>

        <div class="form-group">
            <label for="destination">To Station</label>
            <select id="destination"></select>
        </div>

        <div class="form-group">
            <label for="time">Departure Time</label>
            <input type="text" id="time">
        </div>

        <button onclick="calculateRoutes()">Find Next Trains</button>

        <div id="results"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="router_planner.js"></script>
    <script>
        let metroData = null;

        // Populate Dropdowns
        function initDropdowns() {
            const stationsSet = new Set();
            metroData.lines.forEach(line => {
                line.directions[0].stations.forEach(s => stationsSet.add(s));
            });

            const stations = Array.from(stationsSet).sort();
            const originSelect = document.getElementById('origin');
            const destSelect = document.getElementById('destination');

            stations.forEach(station => {
                originSelect.add(new Option(station, station));
                destSelect.add(new Option(station, station));
            });

            // Set default destinations
            originSelect.value = "Automotive Square";
            destSelect.value = "Lokmanya Nagar";
        }

        // Initialize
        flatpickr("#time", {
            enableTime: true,
            noCalendar: true,
            dateFormat: "H:i",
            altInput: true,
            altFormat: "h:i K",
            time_24hr: false,
            defaultDate: new Date()
        });

        fetch('routes.json')
            .then(response => response.json())
            .then(data => {
                metroData = data;
                initDropdowns();
            })
            .catch(error => {
                console.error('Error loading routes.json:', error);
                document.getElementById('results').innerHTML = '<p class="error">Error loading route data.</p>';
            });
    </script>

</body>

</html>
