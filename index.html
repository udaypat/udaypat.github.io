<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nagpur Metro Route Planner</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Flatpickr CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/material_orange.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm mb-4 py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="#">
                <i class="bi bi-train-front text-metro-orange fs-3"></i>
                <span class="text-dark">Nagpur Metro</span>
            </a>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row g-4">

            <!-- Form Column -->
            <div class="col-lg-4 col-md-5">
                <div class="card card-custom p-4">
                    <h5 class="fw-bold mb-4 text-metro-orange">Plan Your Journey</h5>

                    <div class="mb-3 position-relative">
                        <label for="origin" class="form-label">From Station</label>
                        <select id="origin" class="form-select"></select>
                    </div>

                    <div class="text-center" style="height: 0;">
                        <button class="swap-btn" onclick="swapStations()" title="Swap Stations">
                            <i class="bi bi-arrow-down-up"></i>
                        </button>
                    </div>

                    <div class="mb-4">
                        <label for="destination" class="form-label">To Station</label>
                        <select id="destination" class="form-select"></select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label d-block mb-2">Time Mode</label>
                        <div class="btn-group w-100 btn-group-toggle mb-3" role="group">
                            <input type="radio" class="btn-check" name="timeMode" id="depart" value="depart" checked>
                            <label class="btn btn-light" for="depart">Depart at</label>

                            <input type="radio" class="btn-check" name="timeMode" id="arrive" value="arrive">
                            <label class="btn btn-light" for="arrive">Arrive by</label>
                        </div>

                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i
                                    class="bi bi-clock text-muted"></i></span>
                            <input type="text" id="time" class="form-control border-start-0 ps-0"
                                placeholder="Select Time">
                        </div>
                    </div>

                    <button class="btn btn-metro-orange w-100 py-3 rounded-pill" onclick="calculateRoutes()">
                        <i class="bi bi-search me-2"></i> Find Next Trains
                    </button>
                </div>
            </div>

            <!-- Results Column -->
            <div class="col-lg-8 col-md-7">
                <div id="results">
                    <!-- Initial Empty State -->
                    <div class="card card-custom h-100 d-flex flex-column align-items-center justify-content-center p-5 text-center text-muted"
                        style="min-height: 400px;">
                        <i class="bi bi-map text-light mb-3" style="font-size: 4rem;"></i>
                        <h5 class="fw-bold">Ready to travel?</h5>
                        <p class="mb-0">Select your origin, destination, and time to view the best routes and timings.
                        </p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="router_planner.js"></script>

    <script>
        let metroData = null;

        // Populate Dropdowns
        function initDropdowns() {
            const stationsSet = new Set();
            metroData.lines.forEach(line => {
                line.directions[0].stations.forEach(s => stationsSet.add(s));
            });

            const stations = Array.from(stationsSet).sort();
            const originSelect = document.getElementById('origin');
            const destSelect = document.getElementById('destination');

            stations.forEach(station => {
                originSelect.add(new Option(station, station));
                destSelect.add(new Option(station, station));
            });

            // Set default destinations
            originSelect.value = "Automotive Square";
            destSelect.value = "Lokmanya Nagar";
        }

        // Swap Stations Helper
        function swapStations() {
            const origin = document.getElementById('origin');
            const dest = document.getElementById('destination');
            const temp = origin.value;
            origin.value = dest.value;
            dest.value = temp;
        }

        // Initialize Flatpickr
        flatpickr("#time", {
            enableTime: true,
            noCalendar: true,
            dateFormat: "H:i",
            altInput: true,
            altFormat: "h:i K",
            time_24hr: false,
            defaultDate: new Date()
        });

        // Load Data
        fetch('routes.json')
            .then(response => response.json())
            .then(data => {
                metroData = data;
                initDropdowns();
            })
            .catch(error => {
                console.error('Error loading routes.json:', error);
                document.getElementById('results').innerHTML = `
                    <div class="alert alert-danger d-flex align-items-center" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2 flex-shrink-0"></i>
                        <div>Error loading route data. Please ensure routes.json is available.</div>
                    </div>`;
            });
    </script>
</body>

</html>
